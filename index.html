<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Payment Logger</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f3ee; --surface: #ffffff; --surface2: #f0ede6;
    --border: #d9d4c8; --border-strong: #b8b2a4;
    --text: #1a1815; --text-muted: #6b6560; --text-faint: #9e9890;
    --accent: #2a5c45; --accent-light: #e8f2ed; --accent-text: #1d4030;
    --danger: #c0392b; --danger-light: #fdf1f0;
    --mono: 'DM Mono', monospace; --sans: 'DM Sans', sans-serif;
  }
  body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem 4rem; }
  .page-header { width: 100%; max-width: 520px; margin-bottom: 2.5rem; padding-top: 1rem; }
  .page-header .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 0.5rem; }
  .page-header h1 { font-size: 26px; font-weight: 500; letter-spacing: -0.02em; color: var(--text); line-height: 1.2; }
  .page-header p { margin-top: 0.4rem; font-size: 14px; color: var(--text-muted); font-weight: 300; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; width: 100%; max-width: 520px; }
  .field { margin-bottom: 1.5rem; }
  label { display: block; font-size: 12px; font-family: var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
  input[type="text"] { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); font-family: var(--sans); font-size: 15px; outline: none; transition: border-color 0.15s; -webkit-appearance: none; }
  input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(42,92,69,0.08); }
  input::placeholder { color: var(--text-faint); }
  .upload-zone { border: 1.5px dashed var(--border-strong); border-radius: 12px; padding: 2rem 1rem; text-align: center; cursor: pointer; background: var(--surface2); position: relative; transition: all 0.15s; }
  .upload-zone:hover, .upload-zone.drag-over { border-color: var(--accent); background: var(--accent-light); }
  .upload-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .upload-icon { width: 40px; height: 40px; margin: 0 auto 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
  .upload-icon svg { width: 20px; height: 20px; stroke: var(--text-muted); }
  .upload-zone .upload-text { font-size: 14px; color: var(--text); }
  .upload-zone .upload-sub { font-size: 12px; color: var(--text-faint); margin-top: 4px; }
  .preview-wrap { margin-top: 12px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); background: var(--surface2); display: none; }
  .preview-wrap img { width: 100%; max-height: 260px; object-fit: contain; display: block; }
  .preview-meta { padding: 8px 12px; font-size: 12px; font-family: var(--mono); color: var(--text-muted); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .remove-btn { background: none; border: none; cursor: pointer; color: var(--danger); font-size: 12px; font-family: var(--mono); padding: 0; text-decoration: underline; }
  .divider { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
  .submit-btn { width: 100%; padding: 13px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-family: var(--sans); font-size: 15px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.15s, transform 0.1s; }
  .submit-btn:hover { background: var(--accent-text); }
  .submit-btn:active { transform: scale(0.99); }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .status { margin-top: 1rem; padding: 12px 16px; border-radius: 8px; font-size: 13px; display: none; line-height: 1.5; }
  .status.success { background: var(--accent-light); color: var(--accent-text); border: 1px solid #b2d4c4; display: block; }
  .status.error { background: var(--danger-light); color: var(--danger); border: 1px solid #f0c0bb; display: block; }
  .status.loading { background: #f0f0f0; color: var(--text-muted); border: 1px solid var(--border); display: block; }
  .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite; display: none; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 480px) { .card { padding: 1.25rem; } }
</style>
</head>
<body>

<div class="page-header">
  <p class="eyebrow">Payment Tracker</p>
  <h1>Log a transfer</h1>
  <p>Enter the sender's name and upload the screenshot. The rest is automatic.</p>
</div>

<div class="card">
  <div class="field">
    <label for="sender-name">Sender name</label>
    <input type="text" id="sender-name" placeholder="e.g. Maria Santos" autocomplete="off" />
  </div>

  <div class="field">
    <label>Screenshot / proof of payment</label>
    <div class="upload-zone" id="drop-zone">
      <input type="file" id="file-input" accept="image/*" />
      <div class="upload-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </div>
      <p class="upload-text">Click to upload or drag here</p>
      <p class="upload-sub">PNG, JPG, JPEG — max 5MB</p>
    </div>
    <div class="preview-wrap" id="preview-wrap">
      <img id="preview-img" src="" alt="Transfer screenshot" />
      <div class="preview-meta">
        <span id="preview-filename">—</span>
        <button class="remove-btn" onclick="removeFile()">remove</button>
      </div>
    </div>
  </div>

  <hr class="divider" />

  <button class="submit-btn" id="submit-btn" onclick="handleSubmit()">
    <div class="spinner" id="spinner"></div>
    <span id="btn-text">Analyse &amp; Save to Sheet</span>
  </button>

  <div class="status" id="status"></div>
</div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbybviL4DbEkzk-ZAQuvwAboHfdHzRDoid61CTr5gQvnywYeynJXXj1_ILHRI8ZeEcBt/exec';

  let fileData = null, fileName = null, fileSize = null;

  const fileInput = document.getElementById('file-input');
  const dropZone = document.getElementById('drop-zone');

  fileInput.addEventListener('change', e => { if (e.target.files[0]) processFile(e.target.files[0]); });
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('drag-over');
    if (e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]);
  });

  function processFile(file) {
    if (file.size > 5 * 1024 * 1024) { showStatus('error', 'File too large. Max 5MB.'); return; }
    fileName = file.name;
    fileSize = (file.size / 1024).toFixed(0) + ' KB';
    const reader = new FileReader();
    reader.onload = ev => {
      fileData = ev.target.result;
      document.getElementById('preview-img').src = fileData;
      document.getElementById('preview-filename').textContent = fileName + ' · ' + fileSize;
      document.getElementById('preview-wrap').style.display = 'block';
    };
    reader.readAsDataURL(file);
  }

  function removeFile() {
    fileData = null; fileName = null; fileSize = null;
    fileInput.value = '';
    document.getElementById('preview-wrap').style.display = 'none';
    document.getElementById('preview-img').src = '';
    document.getElementById('preview-filename').textContent = '—';
  }

  function showStatus(type, msg) {
    const el = document.getElementById('status');
    el.className = 'status ' + type;
    el.textContent = msg;
  }

  function setLoading(on, msg) {
    const btn = document.getElementById('submit-btn');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btn-text');
    btn.disabled = on;
    spinner.style.display = on ? 'block' : 'none';
    if (on) { btnText.textContent = msg || 'Working...'; }
    else { btnText.innerHTML = 'Analyse &amp; Save to Sheet'; }
  }

  async function handleSubmit() {
    const senderName = document.getElementById('sender-name').value.trim();
    if (!senderName) { showStatus('error', 'Please enter the sender\'s name.'); return; }
    if (!fileData) { showStatus('error', 'Please upload a screenshot first.'); return; }

    setLoading(true, 'Saving...');
    showStatus('loading', 'Reading screenshot and saving...');

    const timestamp = new Date().toLocaleString('en-PH', {
      timeZone: 'Asia/Manila', year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
    });

    const payload = { timestamp, senderName, fileName: fileName || '', imageData: fileData };

    try {
      // Use XMLHttpRequest instead of fetch to avoid CORS preflight issues
      await new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('POST', SCRIPT_URL, true);
        xhr.setRequestHeader('Content-Type', 'text/plain'); // text/plain avoids preflight
        xhr.onload = () => resolve(xhr.responseText);
        xhr.onerror = () => reject(new Error('Network error'));
        xhr.send(JSON.stringify(payload));
      });

      showStatus('success', '✓ Saved! Entry logged to Google Sheet.');
      document.getElementById('sender-name').value = '';
      removeFile();

    } catch (err) {
      showStatus('error', 'Failed: ' + err.message);
    }

    setLoading(false);
  }
</script>

</body>
</html>
